<svg width="100%" viewBox="0 0 680 620" role="img" xmlns="http://www.w3.org/2000/svg">
<title>SubViet pipeline architecture</title>
<desc>Flowchart mô tả toàn bộ pipeline xử lý của SubViet từ upload file đến output</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    .box-gray   { fill:#F1EFE8; stroke:#888780; }
    .box-purple { fill:#EEEDFE; stroke:#534AB7; }
    .box-teal   { fill:#E1F5EE; stroke:#0F6E56; }
    .box-coral  { fill:#FAECE7; stroke:#993C1D; }
    .box-amber  { fill:#FAEEDA; stroke:#854F0B; }
    .th  { font-family:sans-serif; font-size:14px; font-weight:600; fill:#2C2C2A; }
    .ts  { font-family:sans-serif; font-size:12px; font-weight:400; fill:#5F5E5A; }
    .arr { fill:none; stroke:#888780; stroke-width:0.8; }
    @media (prefers-color-scheme:dark){
      .box-gray   { fill:#444441; stroke:#B4B2A9; }
      .box-purple { fill:#3C3489; stroke:#AFA9EC; }
      .box-teal   { fill:#085041; stroke:#5DCAA5; }
      .box-coral  { fill:#712B13; stroke:#F0997B; }
      .box-amber  { fill:#633806; stroke:#EF9F27; }
      .th  { fill:#D3D1C7; }
      .ts  { fill:#B4B2A9; }
      .arr { stroke:#B4B2A9; }
    }
  </style>
</defs>

<!-- Row 0: Inputs -->
<rect class="box-gray" x="40" y="30" width="180" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="130" y="56" text-anchor="middle">Video / Audio</text>
<text class="ts" x="130" y="72" text-anchor="middle">mp4 mkv mp3 wav …</text>

<rect class="box-gray" x="250" y="30" width="180" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="56" text-anchor="middle">NVIDIA NIM key</text>
<text class="ts" x="340" y="72" text-anchor="middle">nvapi-xxx · localStorage</text>

<rect class="box-gray" x="460" y="30" width="180" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="550" y="56" text-anchor="middle">Cài đặt</text>
<text class="ts" x="550" y="72" text-anchor="middle">model · genre · lang · style</text>

<!-- converge lines to upload -->
<line class="arr" x1="130" y1="82" x2="130" y2="144"/>
<line class="arr" x1="340" y1="82" x2="340" y2="144"/>
<line class="arr" x1="550" y1="82" x2="550" y2="144"/>
<line class="arr" x1="130" y1="144" x2="550" y2="144"/>
<line class="arr" x1="340" y1="144" x2="340" y2="158" marker-end="url(#arrow)"/>

<!-- Row 1: Flask -->
<rect class="box-purple" x="200" y="158" width="280" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="184" text-anchor="middle">Flask /upload</text>
<text class="ts" x="340" y="200" text-anchor="middle">POST multipart/form-data → job_id</text>

<!-- Row 2: process_video -->
<line class="arr" x1="340" y1="210" x2="340" y2="254" marker-end="url(#arrow)"/>
<rect class="box-purple" x="200" y="254" width="280" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="280" text-anchor="middle">process_video()</text>
<text class="ts" x="340" y="296" text-anchor="middle">daemon thread · kiểm tra FFmpeg</text>

<!-- Row 3: Whisper -->
<line class="arr" x1="340" y1="306" x2="340" y2="350" marker-end="url(#arrow)"/>
<rect class="box-teal" x="200" y="350" width="280" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="376" text-anchor="middle">Whisper transcribe</text>
<text class="ts" x="340" y="392" text-anchor="middle">tiny → large · detect language</text>

<!-- Row 4: NIM translate -->
<line class="arr" x1="340" y1="402" x2="340" y2="446" marker-end="url(#arrow)"/>
<rect class="box-teal" x="200" y="446" width="280" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="472" text-anchor="middle">NIM API translate</text>
<text class="ts" x="340" y="488" text-anchor="middle">Llama 3.3 70B · batch 20 · genre prompt</text>

<!-- fan-out -->
<line class="arr" x1="340" y1="498" x2="340" y2="542"/>
<line class="arr" x1="76"  y1="542" x2="596" y2="542"/>
<line class="arr" x1="76"  y1="542" x2="76"  y2="556" marker-end="url(#arrow)"/>
<line class="arr" x1="204" y1="542" x2="204" y2="556" marker-end="url(#arrow)"/>
<line class="arr" x1="332" y1="542" x2="332" y2="556" marker-end="url(#arrow)"/>
<line class="arr" x1="460" y1="542" x2="460" y2="556" marker-end="url(#arrow)"/>
<line class="arr" x1="596" y1="542" x2="596" y2="556" marker-end="url(#arrow)"/>

<!-- Row 5: Outputs -->
<rect class="box-coral" x="20"  y="556" width="112" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="76"  y="582" text-anchor="middle">SRT / VTT</text>
<text class="ts" x="76"  y="598" text-anchor="middle">tiếng Việt</text>

<rect class="box-coral" x="148" y="556" width="112" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="204" y="582" text-anchor="middle">Original SRT</text>
<text class="ts" x="204" y="598" text-anchor="middle">ngôn ngữ gốc</text>

<rect class="box-coral" x="276" y="556" width="112" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="332" y="582" text-anchor="middle">Bilingual SRT</text>
<text class="ts" x="332" y="598" text-anchor="middle">song ngữ</text>

<rect class="box-coral" x="404" y="556" width="112" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="460" y="582" text-anchor="middle">ASS subtitle</text>
<text class="ts" x="460" y="598" text-anchor="middle">6 styles</text>

<rect class="box-amber" x="532" y="556" width="128" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="596" y="582" text-anchor="middle">Video burn-in</text>
<text class="ts" x="596" y="598" text-anchor="middle">FFmpeg libx264</text>

<!-- Right side poll -->
<rect class="box-gray" x="568" y="254" width="94" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="615" y="276" text-anchor="middle">GET /status</text>
<text class="ts" x="614" y="322" text-anchor="middle">poll 1.5s</text>
<path d="M615 298 Q615 342 615 370 Q615 395 598 395 Q568 395 548 395" fill="none" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="478" y="390" text-anchor="end">progress 0→100%</text>
</svg>
